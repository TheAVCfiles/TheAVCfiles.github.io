<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Systems, software, and evidence of work by A. C. Van Cura.">
  <title>A. C. Van Cura | Systems and Evidence</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #4b5563;
      --paper: #f7f7f4;
      --card: #ffffff;
      --line: #d7d9dd;
      --accent: #6d28d9;
      --accent-soft: #ede9fe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(820px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 18px 60px rgba(17, 24, 39, 0.08);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.3rem);
      line-height: 0.98;
      letter-spacing: -0.045em;
    }

    .lede {
      max-width: 680px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1.08rem, 2.2vw, 1.38rem);
      line-height: 1.6;
    }

    .doctrine {
      margin: 28px 0 0;
      padding: 16px 18px;
      border-left: 5px solid var(--accent);
      background: var(--accent-soft);
      font-weight: 800;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
    }

    a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    a:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">TheAVCfiles</p>
    <h1>A. C. Van Cura</h1>
    <p class="lede">
      Systems architect, choreographer, writer, and founder building governed interfaces for movement, memory, proof, access, and value.
    </p>
    <p class="doctrine">The relationship explains access. The record establishes contribution.</p>
    <nav aria-label="Primary links">
      <a class="primary" href="evidence-of-work.html">View Evidence of Work</a>
      <a href="https://github.com/TheAVCfiles">GitHub Profile</a>
      <a href="https://theavcfiles.github.io/Decrypt-The-Girl/">Decrypt The Girl</a>
    </nav>
  </main>
</body>
</html>
